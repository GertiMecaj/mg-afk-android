name: Apply plant journal feature

on:
  push:
    branches:
      - feat/plant-journal-log

permissions:
  contents: write

jobs:
  patch-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plant-journal-log
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Apply source changes
        run: python3 .github/scripts/apply_plant_journal.py

      - name: Build and test
        run: |
          gradle wrapper --gradle-version 9.3.1
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mg-afk-plant-journal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add Garden Journal logging from storage"
          git push origin HEAD:feat/plant-journal-log

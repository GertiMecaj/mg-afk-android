name: Build GOD Mode APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Apply GOD mode patches
        run: |
          patch -p2 < god-mode.patch
          patch -p2 < god-mode-v2-02-mainviewmodel.patch
          patch -p2 < god-mode-v2-03-filterrules.patch
          patch -p2 < god-mode-v2-04-mainscreen.patch
          patch -p2 < god-mode-v2-05a-godcard.patch
          patch -p2 < god-mode-v2-05b-godcard.patch
          patch -p2 < god-mode-v2-05c-godcard.patch
          patch -p2 < god-mode-v3-lowest-bulk-feed.patch

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MG-AFK-2.4.18-GOD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-AFK-2.4.18-GOD
          path: MG-AFK-2.4.18-GOD.apk
          if-no-files-found: error

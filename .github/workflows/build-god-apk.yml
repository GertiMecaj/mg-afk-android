name: Build GOD Mode APK - Fast Money Batch

on:
  push:
    branches:
      - feat/fast-money-batch-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Apply GOD mode patches
        shell: bash
        run: |
          set -o pipefail
          patch -p2 < god-mode.patch
          patch -p2 < god-mode-v2-02-mainviewmodel.patch
          patch -p2 < god-mode-v2-03-filterrules.patch
          patch -p2 < god-mode-v2-04-mainscreen.patch
          patch -p2 < god-mode-v2-05a-godcard.patch
          patch -p2 < god-mode-v2-05b-godcard.patch
          patch -p2 < god-mode-v2-05c-godcard.patch
          patch -p2 < god-mode-v3-lowest-bulk-feed.patch
          cat god-mode-v4-01-mainviewmodel.part1 god-mode-v4-01-mainviewmodel.part2 | git apply --recount -p2 -
          patch -p2 < god-mode-v4-02-mainscreen.patch
          cat god-mode-v4-03-godcard.part1 god-mode-v4-03-godcard.part2 | git apply --recount -p2 -
          patch -p2 < god-mode-v5-01-mainviewmodel.patch
          patch -p2 < god-mode-v5-02-mainscreen.patch
          cat god-mode-v5-03-godcard.part1 god-mode-v5-03-godcard.part2 | patch -p2
          sed -e 's#/mnt/data/god_v5_work/mg-afk-android-2.4.18/##g' -e 's#/mnt/data/god_v6_work/mg-afk-android-2.4.18/##g' god-mode-v6-config-before-on.patch | patch -p0
          patch -p2 < god-mode-v7-strawberry-only-feed.patch
          patch -p1 < god-mode-v8-pet-protect-gold-rainbow.patch
          git apply --check magic-garden-v1107.patch
          git apply magic-garden-v1107.patch
          python3 fix-qol-transformer.py
          python3 apply-qol-v9.py 2>&1 | tee /tmp/qol-v9.log
          python3 fast-money-v10.py 2>&1 | tee /tmp/fast-money-v10.log
          python3 fix-garden-scale-v1107.py
          python3 background-always-on.py

      - name: Upload transformer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-money-v10-diagnostic
          path: |
            /tmp/qol-v9.log
            /tmp/fast-money-v10.log
          if-no-files-found: ignore

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MG-AFK-GOD-FAST-MONEY-BATCH.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-AFK-GOD-FAST-MONEY-BATCH
          path: MG-AFK-GOD-FAST-MONEY-BATCH.apk
          if-no-files-found: error

name: Windows port
on:
  workflow_dispatch:
  push:
    branches: [windows-port]
    paths: ['windows/**','.github/workflows/windows-port.yml']
  pull_request:
    paths: ['windows/**']
jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test windows/tests/MagicGarden.Windows.Core.Tests/MagicGarden.Windows.Core.Tests.csproj -c Release
      - run: dotnet publish windows/src/MagicGarden.Windows/MagicGarden.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/artifacts/app
      - uses: actions/upload-artifact@v4
        with: { name: magic-garden-windows-core, path: windows/artifacts/app }

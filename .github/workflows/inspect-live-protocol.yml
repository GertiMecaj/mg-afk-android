name: Inspect live Magic Garden protocol

on:
  push:
    branches:
      - fix/current-actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live client
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, collections

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          BASE = 'https://magicgarden.gg'
          ACTIONS = [
              'PlantSeed','PlantGardenPlant','WaterPlant','HarvestCrop','PotPlant',
              'Preserve','DisplayCrop','PickupDisplayedCrop','RemoveGardenObject',
              'MutationPotion','CropCleanser','SellAllCrops','PlaceDecor','PickupDecor',
              'GrowEgg','HatchEgg','PlacePet','PickupPet','FeedPet','SellPet','NamePet',
              'SwapPet','SwapPetFromStorage','MovePetSlot','RidePet','DismountPet',
              'DawnCapture','Thundercharge','ReplenishPotion','XPPotion','EquipPetCosmetic',
              'SavePetTeam','ApplyPetTeam','DeletePetTeam','MovePetTeam','SetPetTeamEmblem',
              'MoveInventoryItem','ToggleLockItem','PutItemInStorage','RetrieveItemFromStorage',
              'MoveStorageItem','SwapItemWithStorage','LogItems','PurchaseShopItem','Wish',
              'Ping','PlayerPosition','Teleport','SetSelectedItem','PickupObject','DropObject',
              'ThrowSnowball','CheckWeatherStatus','CheckFriendBonus','RequestPetGreet',
              'QuinoaTutorialSkipped','UpgradePetHutch','UpgradeSeedSilo','UpgradeDecorShed',
              'UpgradeToolShack'
          ]

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(), r.read().decode('utf-8', 'replace')

          _, raw = get(BASE + '/platform/v1/version')
          version = str(json.loads(raw).get('version','')).strip()
          print('LIVE_VERSION', version)
          room_url, html = get(BASE + '/r/test')
          initial = [urllib.parse.urljoin(room_url, x) for x in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', html)]

          q = collections.deque(initial)
          seen = set()
          chunks = {}
          max_chunks = 160
          js_ref_re = re.compile(r'''["'`](?P<ref>(?:\./)?[^"'`\s]+\.js)["'`]''')
          while q and len(seen) < max_chunks:
              url = q.popleft()
              if url in seen: continue
              seen.add(url)
              try:
                  final, text = get(url)
              except Exception as e:
                  print('FETCH_ERR', url, repr(e))
                  continue
              chunks[final] = text
              base_url = final.rsplit('/',1)[0] + '/'
              for m in js_ref_re.finditer(text):
                  ref = m.group('ref')
                  nxt = urllib.parse.urljoin(base_url, ref)
                  if nxt.startswith(BASE + f'/version/{version}/') and nxt not in seen:
                      q.append(nxt)

          print('CHUNKS_FETCHED', len(chunks))
          print('TOTAL_BYTES', sum(len(v) for v in chunks.values()))

          # Print focused contexts for sender/envelope structures and every action literal.
          needles = ['QuinoaCommand','commandSequence','executedCommandSequence'] + ACTIONS
          for needle in needles:
              hits = []
              for url, text in chunks.items():
                  start = 0
                  while len(hits) < 5:
                      i = text.find(needle, start)
                      if i < 0: break
                      context = text[max(0,i-500):min(len(text),i+700)].replace('\n',' ')
                      hits.append((url.rsplit('/',1)[-1], context))
                      start = i + len(needle)
                  if len(hits) >= 5: break
              print('\n===', needle, 'HITS', len(hits), '===')
              for filename, context in hits:
                  print('FILE', filename)
                  print(context)

          # A compact inventory of action presence by chunk helps locate the protocol module.
          print('\n=== ACTION_CHUNKS ===')
          for action in ACTIONS:
              files = [u.rsplit('/',1)[-1] for u,t in chunks.items() if action in t]
              print(action, ':', ','.join(files[:8]) if files else 'MISSING')
          PY

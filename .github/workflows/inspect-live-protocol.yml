name: Inspect live Magic Garden protocol

on:
  push:
    branches:
      - fix/current-actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live garden scale schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, collections

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          BASE='https://magicgarden.gg'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.geturl(),r.read().decode('utf-8','replace')

          _,raw=get(BASE+'/platform/v1/version')
          version=str(json.loads(raw).get('version','')).strip()
          print('LIVE_VERSION',version)
          room_url,html=get(BASE+'/r/test')
          initial=[urllib.parse.urljoin(room_url,x) for x in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''',html)]
          q=collections.deque(initial); seen=set(); chunks={}
          ref_re=re.compile(r'''["'`](?P<ref>(?:\./)?[^"'`\s]+\.js)["'`]''')
          while q and len(seen)<180:
              url=q.popleft()
              if url in seen: continue
              seen.add(url)
              try: final,text=get(url)
              except Exception: continue
              chunks[final]=text
              root=BASE+f'/version/{version}/assets/'
              for m in ref_re.finditer(text):
                  ref=m.group('ref')
                  if ref.startswith('./'): ref=ref[2:]
                  nxt=root+ref.rsplit('/',1)[-1]
                  if nxt not in seen: q.append(nxt)

          print('CHUNKS', len(chunks))
          needles=[
              'targetScale','plantScale','maxScale','targetMaxScale','maxTargetScale',
              'maturedAt','harvestReadyAt','growSlotIndex','HarvestCrop','baseSellPrice'
          ]
          for needle in needles:
              print('\n###',needle)
              count=0
              for url,text in chunks.items():
                  start=0
                  while count<16:
                      i=text.find(needle,start)
                      if i<0: break
                      print('FILE',url.rsplit('/',1)[-1])
                      print(text[max(0,i-1600):min(len(text),i+2400)].replace('\n',' '))
                      print('---')
                      count+=1; start=i+len(needle)
                  if count>=16: break
              print('COUNT',count)
          PY

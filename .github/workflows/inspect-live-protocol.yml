name: Inspect live Magic Garden protocol

on:
  push:
    branches:
      - fix/current-actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live client
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(), r.read().decode('utf-8', 'replace')

          base = 'https://magicgarden.gg'
          url, raw = get(base + '/platform/v1/version')
          print('VERSION_URL', url)
          print('VERSION_RESPONSE', raw)
          try:
              version = str(json.loads(raw).get('version', '')).strip()
          except Exception:
              version = ''
          print('VERSION', version)

          page_url, html = get(base + '/r/test')
          print('ROOM_PAGE', page_url)
          print('ROOM_HTML_HEAD', html[:3000].replace('\n',' '))
          refs = sorted(set(re.findall(r'''(?:src|href)=["']([^"']+)["']''', html)))
          print('PAGE_REFS')
          for ref in refs:
              print(ref)

          # Probe common versioned index locations and any JS refs in the page.
          candidates = []
          for ref in refs:
              if '.js' in ref:
                  candidates.append(urllib.parse.urljoin(page_url, ref))
          if version:
              candidates += [
                  f'{base}/version/{version}/index.js',
                  f'{base}/version/{version}/assets/index.js',
                  f'{base}/version/{version}/assets/main.js',
              ]

          seen = set()
          print('JS_PROBES')
          for candidate in candidates:
              if candidate in seen: continue
              seen.add(candidate)
              try:
                  final, text = get(candidate)
                  print('OK', candidate, '->', final, 'bytes=', len(text))
                  print('HEAD', text[:800].replace('\n',' '))
                  for needle in ['QuinoaCommand','executedCommandSequence','HarvestCrop','PlantSeed','FeedPet','PurchaseShopItem','LogItems']:
                      i = text.find(needle)
                      if i >= 0:
                          print('HIT', needle, text[max(0,i-300):i+500].replace('\n',' '))
              except Exception as e:
                  print('ERR', candidate, repr(e))
          PY
